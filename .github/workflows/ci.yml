name: CI

on:
  push:
    branches: [main]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stil:
    name: Stil (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        # 3.14 ist die Fassung, mit der die EXE gebaut wird
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # Die Läufer haben keine Grafikkarte. Geprüft werden die Bewertung der
      # Karten, die Startmeldungen, die Sprachtabelle, Laden und Speichern
      # und die Filterformeln mit NumPy - dafür braucht es kein CUDA.
      # Die Vergleiche zwischen CUDA-Kernel und NumPy und alles mit dem
      # Hauptfenster laufen nur lokal mit Grafikkarte und überspringen sich
      # hier von selbst.
      - run: pip install pytest nvidia-ml-py numpy Pillow tifffile imagecodecs rawpy
      # Die Oberflächentests ohne Grafikkarte: nur unter Windows, wo die EXE läuft.
      # QT_PFLICHT macht aus einem fehlenden Qt einen Fehler statt eines Skips.
      - if: runner.os == 'Windows'
        run: pip install PySide6
      - run: python -m pytest tests -q
        env:
          QT_QPA_PLATFORM: offscreen
          QT_PFLICHT: ${{ runner.os == 'Windows' && '1' || '' }}
